name: Import MWEB Vault

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-mweb-vault.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download MWEB Vault source snapshot
        run: |
          mkdir -p /tmp/mweb-vault-source
          curl -L --fail https://codeload.github.com/AjaxPop/Mweb_electrum_ltc/zip/refs/heads/mweb -o /tmp/mweb.zip
          unzip -q /tmp/mweb.zip -d /tmp
          SRC_DIR="$(find /tmp -maxdepth 1 -type d -name 'Mweb_electrum_ltc-*' | head -n1)"
          cp -a "$SRC_DIR/." /tmp/mweb-vault-source/

          curl -L --fail https://raw.githubusercontent.com/AjaxPop/Mweb_electrum_ltc/fix/spv-cve-2012-2459/electrum/verifier.py -o /tmp/verifier.py
          curl -L --fail https://raw.githubusercontent.com/AjaxPop/Mweb_electrum_ltc/fix/spv-cve-2012-2459/tests/test_verifier.py -o /tmp/test_verifier.py

      - name: Import standalone codebase
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/import-mweb-vault.yml' /tmp/mweb-vault-source/ ./

          cp /tmp/verifier.py electrum/verifier.py
          cp /tmp/test_verifier.py tests/test_verifier.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          text = text.replace('https://github.com/AjaxPop/Mweb_electrum_ltc', 'https://github.com/AjaxPop/MWEB-Vault-')
          text = text.replace('$ cd Mweb_electrum_ltc', '$ cd MWEB-Vault-')
          p.write_text(text)
          PY

      - name: Commit imported files
        run: |
          git config user.name "AjaxPop"
          git config user.email "54447040+AjaxPop@users.noreply.github.com"
          git add -A
          git commit -m "Import standalone MWEB Vault codebase with SPV hardening"
          git push origin main
