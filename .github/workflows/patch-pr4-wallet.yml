name: Apply PR4 wallet bump-fee fix

on:
  push:
    branches:
      - automation-pr4-wallet-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ci-build-mwebd
          fetch-depth: 0

      - name: Apply guarded wallet fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("electrum/wallet.py")
          lines = path.read_text().splitlines(keepends=True)
          matches = []
          for i in range(len(lines) - 2):
              if (
                  lines[i].strip() == "change_addrs=change_addrs,"
                  and lines[i + 1].strip() == "fee_estimator_vb=fee_estimator,"
                  and lines[i + 2].strip() == "dust_threshold=self.dust_threshold())"
              ):
                  matches.append(i)

          if len(matches) != 1:
              raise SystemExit(f"expected exactly one bump-fee target, found {len(matches)}")

          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines.insert(i + 1, f"{indent}keystore=self.keystore,\n")
          path.write_text("".join(lines))
          PY

      - name: Commit fix to PR 4 branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add electrum/wallet.py
          git commit -m "fix(wallet): pass keystore when bumping fees"
          git push origin HEAD:ci-build-mwebd
