name: PR Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ci-build-mwebd

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ci-build-mwebd
          fetch-depth: 0

      - name: Apply fixture scanner fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("tests/__init__.py")
          text = path.read_text(encoding="utf-8")
          marker = "escaped_backslash = re.escape(chr(92))"
          if marker not in text:
              lines = text.splitlines(keepends=True)
              matches = [
                  i for i, line in enumerate(lines)
                  if line.strip().startswith("json_string_re = re.compile(")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected exactly one json_string_re assignment, found {len(matches)}"
                  )
              i = matches[0]
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              lines[i:i + 1] = [
                  f"{indent}escaped_backslash = re.escape(chr(92))\n",
                  f"{indent}json_string_re = re.compile(\n",
                  f"{indent}    '\"' + '([^\"' + escaped_backslash + ']*(?:'\n",
                  f"{indent}    + escaped_backslash + '.[^\"' + escaped_backslash + ']*)*)' + '\"'\n",
                  f"{indent})\n",
              ]
              path.write_text("".join(lines), encoding="utf-8")
          PY

          python -m py_compile tests/__init__.py
          git diff --check

          if ! git diff --quiet -- tests/__init__.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/__init__.py
            git diff --cached --check
            git commit -m "tests: fix historical wallet fixture scanner regex"
            git push origin HEAD:ci-build-mwebd
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake libtool

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build libsecp256k1
        run: ./contrib/make_libsecp256k1.sh

      - name: Configure libsecp256k1 runtime path
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/electrum${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install test dependencies
        env:
          ELECTRUM_ECC_DONT_COMPILE: "1"
        run: |
          pip install -r contrib/requirements/requirements-ci.txt
          pip install ".[tests]"

      - name: Run fixture conversion diagnostics
        run: |
          pytest \
            tests/test_storage_upgrade.py \
            tests/test_commands.py::TestCommandsTestnet::test_onchain_history \
            -q --tb=short --maxfail=20
