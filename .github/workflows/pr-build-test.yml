name: PR Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ci-build-mwebd
          submodules: recursive

      - name: Apply history-export BOLT11 fixture compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_wallet.py")
          text = path.read_text(encoding="utf-8")
          old = "        test_wallet = daemon.load_wallet(wallet_path, None, upgrade=True)\n"
          new = (
              "        # Preserve the original signed Bitcoin-testnet BOLT11 invoices in this historical fixture.\n"
              "        # The HRP is part of the signature, so validate the fixture as 'tb' only while loading it.\n"
              "        with mock.patch('electrum.constants.BitcoinTestnet.BOLT11_HRP', 'tb'):\n"
              "            test_wallet = daemon.load_wallet(wallet_path, None, upgrade=True)\n"
          )
          if old not in text:
              if new in text:
                  print("history-export compatibility patch already present")
              else:
                  raise SystemExit("target daemon.load_wallet line not found")
          else:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one target line, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_wallet.py
          if ! git diff --cached --quiet; then
            git commit -m "tests: preserve historical BOLT11 history fixture"
            git push origin HEAD:ci-build-mwebd
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: contrib/mwebd/go.mod
          cache-dependency-path: contrib/mwebd/go.sum

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            libtool \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build libsecp256k1
        run: |
          ./contrib/make_libsecp256k1.sh

      - name: Configure libsecp256k1 runtime path
        run: |
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/electrum${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build mwebd
        run: |
          ./contrib/make_mwebd.sh

      - name: Install test dependencies
        env:
          ELECTRUM_ECC_DONT_COMPILE: "1"
        run: |
          pip install -r contrib/requirements/requirements-ci.txt
          pip install ".[tests,qml_gui]"

      - name: Verify MWEB Vault imports
        run: |
          python -c "import electrum; print('MWEB Vault import successful')"

      - name: Compile Python source
        run: |
          python -m compileall -q electrum

      - name: Run unit tests
        run: pytest tests -q --tb=short --maxfail=1
