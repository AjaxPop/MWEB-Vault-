name: Apply Litecoin test port fixes

on:
  push:
    branches:
      - ci-build-mwebd

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-build-mwebd
          fetch-depth: 0

      - name: Apply guarded fixes
        run: python .github/scripts/apply_litecoin_test_port_fixes.py

      - name: Compile patched tests
        run: python -m compileall -q tests

      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "tests: finish Litecoin fixture port"
          git push origin HEAD:ci-build-mwebd
